version: '3'

tasks:
  build-parser:
    desc: Compile the syon-parser library crate
    cmds:
      - cargo build -p syon-parser

  build-cli-binary:
    desc: Compile the syon-cli binary crate
    cmds:
      - cargo build -p syon-cli

  build-all:
    desc: Compile every crate in the workspace
    cmds:
      - cargo build --workspace

  test-parser:
    desc: Run unit tests for syon-parser
    cmds:
      - cargo test -p syon-parser

  test-all:
    desc: Run unit tests for every workspace crate
    cmds:
      - cargo test --workspace

  run-cli-binary:
    desc: Parse a .syon file and print the AST as JSON
    cmds:
      - cargo run -p syon-cli -- {{.CLI_ARGS}}

  check-all:
    desc: Type-check the whole workspace without producing artifacts
    cmds:
      - cargo check --workspace

  lint-all:
    desc: Run Clippy on the whole workspace
    cmds:
      - cargo clippy --workspace -- -D warnings

  format-all:
    desc: Format every source file with rustfmt
    cmds:
      - cargo fmt --all

  clean-build-artifacts:
    desc: Remove all Cargo build artifacts
    cmds:
      - cargo clean

  build-python-bindings:
    desc: Build and install the syon Python extension in development mode
    cmds:
      - maturin develop -m crates/syon-python/Cargo.toml

  run-parser-tests:
    desc: Run unit tests for the syon-parser crate
    cmds:
      - cargo test -p syon-parser

  build-ffi-library:
    desc: Build syon-parser cdylib and staticlib in release mode
    cmds:
      - cargo build -p syon-parser --release

  docs-sync:
    desc: Copy spec/ and design/architecture/ into docs/ so the Zensical site can include them
    cmds:
      - mkdir -p docs/spec docs/decisions
      - cp spec/*.md docs/spec/
      - cp design/architecture/README.md design/architecture/*.syon docs/decisions/

  docs-build:
    desc: Build the Zensical documentation site into site/ (requires `pip install zensical`)
    deps: [docs-sync]
    cmds:
      - zensical build

  docs-serve:
    desc: Serve the Zensical documentation site locally with live reload (requires `pip install zensical`)
    deps: [docs-sync]
    cmds:
      - zensical serve

  phase1-report:
    desc: Evaluate Block 1/2/3 usage, complexity, and YAML compatibility (Rust); writes phase1.report.syon
    cmds:
      - cargo run -q -p syon-cli -- phase1 {{.CLI_ARGS}}

  phase1-report-go:
    desc: Same as phase1-report, using the Go implementation; writes syon-go/phase1.report.syon
    dir: syon-go
    cmds:
      - go run ./cmd/phase1 {{.CLI_ARGS}}

  test-python-bindings:
    desc: Run pytest suite for the Python extension
    cmds:
      - python3 -m pytest crates/syon-python/tests/ -v

  test-ffi-bindings:
    desc: Compile and run C FFI integration test
    cmds:
      - cargo build -p syon-parser --release
      - cc tests/ffi/test_ffi.c -L target/release -lsyon_parser -o /tmp/test_ffi
      - /tmp/test_ffi
