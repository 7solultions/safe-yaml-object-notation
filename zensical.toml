[project]

site_name = "SYON"
site_description = "SYON — Safe YAML Object Notation: a minimal, safe subset of YAML."
site_author = "SYON contributors"
site_url = "https://object-notation-environment.github.io/safe-yaml-object-notation/"
copyright = """
Copyright &copy; 2026 The SYON authors
"""

nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Language guide" = "language.md" },
  { "CLI reference" = "cli.md" },
  { "Python bindings" = "python.md" },
  { "Glossary example" = "examples.md" },
  { "Specification" = [
      { "Lexer" = "spec/01-lexer.md" },
      { "Grammar" = "spec/02-grammar.md" },
      { "Semantics" = "spec/03-semantics.md" },
      { "Glossary schema" = "spec/04-glossary-schema.md" },
    ] },
]

[project.theme]

language = "en"

features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/object-notation-environment/safe-yaml-object-notation"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
