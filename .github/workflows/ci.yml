name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell
        run: codespell

  taskfile-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Validate Taskfile.yml
        run: task --list-all

  examples-valid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build syon-cli
        run: cargo build -p syon-cli

      - name: Parse every example and ADR .syon file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            if ! cargo run -q -p syon-cli -- "$file" > /dev/null; then
              echo "FAILED: $file"
              status=1
            fi
            echo "::endgroup::"
          done < <(find examples docs/decisions -name '*.syon' -print0)
          exit "$status"

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syon-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: syon-go/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  cargo-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

  docs-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Sync spec/ into docs/spec/
        run: |
          mkdir -p docs/spec
          cp spec/*.md docs/spec/

      - name: Build docs (strict) and capture output
        id: build
        run: |
          set +e
          zensical build --clean --strict > zensical-output.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat zensical-output.txt

      - name: Post build report to PR discussion
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('zensical-output.txt', 'utf8').trim();
            const status = '${{ steps.build.outputs.status }}';
            const ok = status === '0';
            const marker = '<!-- docs-eval-report -->';
            const body = [
              marker,
              '### Docs build report (Zensical, strict mode)',
              '',
              ok ? ':white_check_mark: Build succeeded with no warnings or errors.'
                 : `:x: Build failed (exit code ${status}) — warnings are treated as errors in strict mode.`,
              '',
              '<details><summary>Full output</summary>',
              '',
              '```',
              output || '(no output)',
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if docs build had warnings or errors
        if: steps.build.outputs.status != '0'
        run: exit 1
